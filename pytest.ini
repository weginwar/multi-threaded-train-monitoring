[pytest]
minversion = 7.0

# Updated to reflect your new folder name
testpaths = tests

# Naming conventions for discovery
; python_files = test_*.py
; python_classes = Test*
; python_functions = test_*

# Default command line options
addopts = -v 

# Custom markers
markers =
    ; unit: marks fast-running unit tests
    ; integration: marks integration/threading tests
    ; slow: marks tests that take a long time to run (deselect with '-m "not slow"')